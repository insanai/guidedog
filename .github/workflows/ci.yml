name: Verify
# Quick feedback for every change, on Linux and macOS: build, every test suite, clippy,
# the source limits, and the smoke tests of the built programs.
# Release reuses this commit's passing Verify run and smoke-tests each shipped archive.
on:
  push:
    branches: [main]
    paths: &code
      # Pure PO catalog or release-process prose edits skip this workflow (the Pages
      # workflow still builds the documentation); everything read by workspace tests or
      # release qualification triggers Verify.
      - '**'
      - '!docs/**'
      - '!**.md'
      - '**/README.md'
      - 'README*.md'
      - 'CHANGELOG.md'
      - '.github/release-notes.md'
      - 'docs/**/conf.toml'
      - 'docs/**/*.rst'
      - 'docs/**/*.typ'
      - 'docs/gds/**'
      - 'docs/manual/template/**'
      - 'docs/manual/_static/repository/**'
  pull_request:
    paths: *code
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-amd64, runner: ubuntu-22.04}
          - {name: macos-arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          keyring: ${{ runner.os == 'Linux' }}
      - name: Formatting
        run: cargo fmt --all --check
      - name: Source limits
        run: cargo run --locked -p check
      - name: Data tables match tools/data
        run: cargo xtask tables --check
      - name: Music font matches its pinned upstream files
        run: cargo xtask check-music-font
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --no-fail-fast
        env:
          # The runner images ship Google Chrome; the theme's scripts must run in it.
          GUIDEDOG_REQUIRE_BROWSER: "1"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/shared/fonts/NotoSerifCJKsc-Regular.otf
          key: cjk-music-font-${{ hashFiles('tools/xtask/src/fonts.rs') }}
      - name: Fetch the pinned CJK music test face
        run: cargo xtask fetch-fonts --music
      - name: Native music SVG, PNG and collision corpus
        run: cargo run --locked -p music-check
      - name: Bounded music reader and engraver fuzz corpus
        run: cargo run --locked -p music-check -- --fuzz 12000
      - name: Large-site incremental SSG regression
        run: cargo test --locked -p gd-project --test ssg_benchmark -- --ignored --nocapture
      - name: Linux Secret Service with a real keyring
        if: runner.os == 'Linux'
        run: cargo xtask release credential-store
      - name: Examples run
        run: |
          for example in hello reuse_workspace custom_pass plain_text graphdog; do
            cargo run --locked -q -p guidedoc-examples --example "$example" > /dev/null
          done
      - name: Smoke tests of the built programs
        run: |
          bin=target/debug
          cargo xtask release smoke --external-typst "$bin/guidedog"
          cargo xtask release smoke-discussion "$bin/guidedog"
          cargo xtask release smoke-pages "$bin/guidedog"
