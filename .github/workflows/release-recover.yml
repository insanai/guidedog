name: Recover release publication
# Publishes the files an earlier tagged Release run built and qualified, when only its
# publish (or refresh) job failed, for example because of a GitHub outage. Nothing is
# rebuilt: the files are that run's artifacts, and every other job of that run must have
# succeeded. A published release is never replaced.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.2.0
        required: true
        type: string
      run:
        description: ID of the tagged Release run whose artifacts to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-recovery-${{ inputs.tag }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  previous-gates:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: The run built this tag and passed every gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run }}
          TAG: ${{ inputs.tag }}
        run: tools/release/check-run.sh "$RUN" "$TAG"

  publish:
    needs: previous-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: The release is not published yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: tools/release/publish.sh --check "$TAG"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run }}
          pattern: guidedog-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        run: tools/release/checksums.sh dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/guidedog.rb
      - name: Draft, upload, then publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: tools/release/publish.sh "$TAG" dist

  refresh:
    needs: publish
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Rebuild the documentation site with the new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
