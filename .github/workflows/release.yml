name: Release
# A v* tag builds, qualifies and publishes a release. Running the workflow by hand builds
# a candidate (every job but publishing), optionally for one platform.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build as a candidate (a tag always builds all)
        type: choice
        default: all
        options: [all, linux-amd64, linux-arm64, macos-arm64, macos-amd64, windows-amd64]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Where each release archive is built and smoke-tested. Every archive is built natively
  # on its own platform, with Graphviz built statically there (cargo xtask graphviz).
  # Linux builds on Ubuntu 22.04 (glibc 2.35) on both architectures.
  PLATFORMS: >-
    [{"package": "linux-amd64", "runner": "ubuntu-22.04", "smoke": "ubuntu-22.04"},
     {"package": "linux-arm64", "runner": "ubuntu-22.04-arm", "smoke": "ubuntu-22.04-arm"},
     {"package": "macos-arm64", "runner": "macos-15", "smoke": "macos-15"},
     {"package": "macos-amd64", "runner": "macos-15-intel", "smoke": "macos-15-intel"}]
jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        name: The tag, VERSION and Cargo.toml agree
        run: echo "version=$(cargo xtask release check-version)" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Choose the platforms
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && PLATFORM=all
          matrix=$(echo "$PLATFORMS" |
            jq -c --arg p "$PLATFORM" 'map(select($p == "all" or .package == $p))')
          if [ "$PLATFORM" = windows-amd64 ]; then matrix='[]'; else [ "$matrix" != "[]" ]; fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  qualify:
    name: qualify (${{ matrix.package }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: linux-amd64, runner: ubuntu-22.04}
          - {package: macos-arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          keyring: ${{ runner.os == 'Linux' }}
      - name: Source limits
        run: cargo run --locked -p check
      - name: Data tables match tools/data
        run: cargo xtask tables --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Every test suite (once per qualification OS)
        run: cargo test --locked --workspace --no-fail-fast
      - name: Linux Secret Service with a real keyring
        if: runner.os == 'Linux'
        run: cargo xtask release credential-store

  build:
    name: build (${{ matrix.package }})
    needs: version
    if: inputs.platform != 'windows-amd64'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # gd-graphdog links the static Graphviz in this folder (see crates/gd-graphdog/build.rs).
      GUIDEDOG_GRAPHVIZ_STATIC: ${{ github.workspace }}/target/graphviz/16.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          cache: release
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: graphviz
        with:
          path: target/graphviz/16.1.0
          key: graphviz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/xtask/src/graphviz.rs') }}
      - name: Build the static Graphviz
        if: steps.graphviz.outputs.cache-hit != 'true'
        run: cargo xtask graphviz --jobs 4
      - name: Build Guidedog with embedded Typst, Graphviz and plugins
        run: cargo xtask release build
      - name: The programs report VERSION
        run: |
          for program in guidedog; do
            cargo xtask release check-version "build/$program"
          done
      - name: Package Guidedog with notices and a manifest
        run: cargo xtask release package ${{ matrix.package }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guidedog-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.package }})
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.smoke }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust, for cargo xtask (the smoke tests themselves)
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: guidedog-${{ matrix.package }}
          path: dist
      - name: Unpack the archive and check each program against its manifest
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          cd dist
          tar -xzf "guidedog-$PACKAGE.tar.gz"
          folder=$PWD/guidedog-$PACKAGE
          for binary in $(jq -r '.programs | keys[]' "$folder/guidedog.build.json"); do
            expected=$(jq -r --arg b "$binary" '.programs[$b]' "$folder/guidedog.build.json")
            if command -v sha256sum >/dev/null; then actual=$(sha256sum "$folder/$binary")
            else actual=$(shasum -a 256 "$folder/$binary"); fi
            actual=${actual%% *}
            [ "$actual" = "$expected" ] || { echo "$binary does not match its manifest"; exit 1; }
          done
          {
            echo "PROGRAM=$PWD/guidedog-$PACKAGE/guidedog"
          } >> "$GITHUB_ENV"
      - name: The packaged programs report VERSION
        run: |
          for program in "$PROGRAM"; do
            cargo xtask release check-version "$program"
          done
      - name: Quickstart, HTML and PDF with nothing but the system libraries
        run: cargo xtask release smoke "$PROGRAM"
      - name: Discussion catalogs with guidedog dsc
        run: cargo xtask release smoke-discussion "$PROGRAM"
      - name: Linked Pages plugin, offline
        run: cargo xtask release smoke-pages "$PROGRAM"

  windows:
    name: windows (windows-amd64)
    needs: version
    if: github.ref_type == 'tag' || inputs.platform == 'all' || inputs.platform == 'windows-amd64'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          cache: release
      - name: Build Guidedog and its linked plugins
        run: cargo xtask release build
      - name: Test Windows libraries
        run: cargo test --locked -p gd-graphdog -p gd-clock -p gd-pages
      - name: Package Windows programs and the Graphviz runtime
        run: cargo xtask release package windows-amd64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guidedog-windows-amd64
          path: dist/*.zip
          if-no-files-found: error

  windows-smoke:
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: guidedog-windows-amd64
          path: dist
      - name: Extract and verify the packaged programs
        shell: pwsh
        run: |
          Expand-Archive dist/guidedog-windows-amd64.zip dist/unpacked
          $folder = (Resolve-Path dist/unpacked/guidedog-windows-amd64).Path
          $manifest = Get-Content "$folder/guidedog.build.json" | ConvertFrom-Json
          foreach ($program in $manifest.programs.PSObject.Properties) {
            $actual = (Get-FileHash "$folder/$($program.Name)" -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $program.Value) { throw 'Program checksum mismatch' }
            cargo xtask release check-version "$folder/$($program.Name)"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          "PROGRAM=$folder/guidedog.exe" >> $env:GITHUB_ENV
      - name: HTML, PDF and discussions with an empty PATH
        shell: pwsh
        run: |
          cargo xtask release smoke "$env:PROGRAM"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo xtask release smoke-discussion "$env:PROGRAM"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo xtask release smoke-pages "$env:PROGRAM"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  source:
    needs: version
    if: github.ref_type == 'tag' || inputs.platform == 'all'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo xtask release source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guidedog-source
          path: dist/*
          if-no-files-found: error

  homebrew:
    needs: [version, build]
    if: github.ref_type == 'tag' || inputs.platform == 'all'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: guidedog-*-*
          merge-multiple: true
          path: dist
      - name: Render the formula from the archives
        run: cargo xtask release formula dist
      - name: Install and test the formula from a local tap, using the local archive
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          brew tap-new --no-git guidedog/qualification
          tap=$(brew --repository guidedog/qualification)
          sed "s|https://.*/guidedog-macos-arm64.tar.gz|file://$PWD/dist/guidedog-macos-arm64.tar.gz|" \
            dist/guidedog.rb > "$tap/Formula/guidedog.rb"
          brew install --formula guidedog/qualification/guidedog
          brew test guidedog/qualification/guidedog
          brew uninstall --formula guidedog/qualification/guidedog
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guidedog-formula
          path: dist/guidedog.rb
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [version, qualify, build, smoke, windows, windows-smoke, source, homebrew]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The release is not published yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release publish --check "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: guidedog-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        run: cargo xtask release checksums dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/guidedog.rb
      - name: Draft, upload, then publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release publish "$GITHUB_REF_NAME" dist

  refresh:
    needs: publish
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Rebuild the documentation site with the new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
