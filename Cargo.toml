[workspace]
resolver = "3"
members = [
    "crates/*",
    "cmd/*",
    "tools/check",
    "tools/linkcheck",
    "tools/xtask",
    "examples/*",
    "tests/integration",
]

[workspace.package]
version = "1.0.0-beta.1"
edition = "2024"
license = "LGPL-3.0-or-later"
rust-version = "1.99"
authors = ["Vikrant Rathore"]
repository = "https://github.com/insanai/guidedog"
homepage = "https://insanai.github.io/guidedog/"

[workspace.dependencies]
# Workspace crates. The reusable ones (see docs/manual/internals/crates.rst) are published
# to crates.io, so their entries carry the version too: bump it with
# [workspace.package] version (the dependency gate in tests/integration checks they agree).
guidedoc = { version = "1.0.0-beta.1", path = "crates/guidedoc" }
guidedoc-rst = { version = "1.0.0-beta.1", path = "crates/guidedoc-rst" }
guidedoc-rst-inline = { version = "1.0.0-beta.1", path = "crates/guidedoc-rst-inline" }
guidedoc-commonmark = { version = "1.0.0-beta.1", path = "crates/guidedoc-commonmark" }
guidedoc-sphinx = { version = "1.0.0-beta.1", path = "crates/guidedoc-sphinx" }
guidedoc-cpp = { version = "1.0.0-beta.1", path = "crates/guidedoc-cpp" }
guidedoc-html = { version = "1.0.0-beta.1", path = "crates/guidedoc-html" }
guidedoc-typst = { version = "1.0.0-beta.1", path = "crates/guidedoc-typst" }
guidedoc-text = { version = "1.0.0-beta.1", path = "crates/guidedoc-text" }
guidedoc-rst-writer = { version = "1.0.0-beta.1", path = "crates/guidedoc-rst-writer" }
guidedoc-defaults = { version = "1.0.0-beta.1", path = "crates/guidedoc-defaults" }
gd-report = { version = "1.0.0-beta.1", path = "crates/gd-report" }
gd-toml = { version = "1.0.0-beta.1", path = "crates/gd-toml" }
gd-json = { version = "1.0.0-beta.1", path = "crates/gd-json" }
gd-flate = { version = "1.0.0-beta.1", path = "crates/gd-flate" }
gd-sha = { version = "1.0.0-beta.1", path = "crates/gd-sha" }
gd-jinja = { version = "1.0.0-beta.1", path = "crates/gd-jinja" }
gd-highlight = { version = "1.0.0-beta.1", path = "crates/gd-highlight" }
gd-gettext = { version = "1.0.0-beta.1", path = "crates/gd-gettext" }
gd-graphdog = { version = "1.0.0-beta.1", path = "crates/gd-graphdog" }
gd-fetch = { path = "crates/gd-fetch" }
gd-git = { path = "crates/gd-git" }
gd-pyscan = { version = "1.0.0-beta.1", path = "crates/gd-pyscan" }
gd-autodoc = { version = "1.0.0-beta.1", path = "crates/gd-autodoc" }
gd-odindoc = { version = "1.0.0-beta.1", path = "crates/gd-odindoc" }
gd-inventory = { version = "1.0.0-beta.1", path = "crates/gd-inventory" }
gd-i18n = { path = "crates/gd-i18n" }
gd-typst = { path = "crates/gd-typst" }
gd-host = { path = "crates/gd-host", default-features = false }
gd-project = { path = "crates/gd-project" }
gd-discussion = { path = "crates/gd-discussion" }
gd-plugins = { version = "1.0.0-beta.1", path = "crates/gd-plugins" }
gd-pages = { path = "crates/gd-pages" }
gd-cli = { path = "crates/gd-cli" }
gd-theme = { path = "crates/gd-theme" }
gd-serve = { path = "crates/gd-serve" }
gd-intl = { path = "crates/gd-intl" }
gd-book = { path = "crates/gd-book" }
gd-site = { path = "crates/gd-site" }
gd-read = { path = "crates/gd-read" }
gd-link = { path = "crates/gd-link" }
gd-resolve = { path = "crates/gd-resolve" }
gd-outputs = { path = "crates/gd-outputs" }
gd-env = { path = "crates/gd-env" }
gd-migrate = { path = "crates/gd-migrate" }
gd-conf = { path = "crates/gd-conf" }
gd-clock = { path = "crates/gd-clock" }
gd-rustdoc = { version = "1.0.0-beta.1", path = "crates/gd-rustdoc" }

# External crates: only mature, self-contained ones that solve a genuinely large problem.
# The Typst compiler, pinned to the toolchain version GDS 0002 names.
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-html = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false }
# Python parsing for autodoc (replaces the old C tree-sitter build).
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
# JSON for gd-json. Already compiled in by the embedded Typst compiler (same version and
# features, see Cargo.lock), so it adds no crate; mature, widely used and well tested.
# preserve_order keeps object keys in insertion order (indexmap, also already in the tree).
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# serde's Deserializer/Visitor traits, for gd-json's validating parse and `from_value`.
serde = "1"
# HTTP and HTTPS for gd-fetch, replacing the system `curl` program so Guidedog is
# self-contained. HTTPS (TLS, certificate checks) is a genuinely large problem; ureq is a
# mature, small, blocking client and rustls a mature TLS stack in Rust, with Mozilla's root
# certificates built in (webpki-roots), so no OpenSSL or system CA store is needed. Major
# version 2 matches the copy already in the tree (one copy of ureq), but it is chosen on
# its own merits. No gzip: bodies are read as sent.
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
# Unsafe code only in FFI modules, each opened with #[allow(unsafe_code)] (see the
# unsafe_code gate in tests/integration); crates without FFI forbid it outright.
unsafe_code = "deny"

[workspace.lints.clippy]
too_many_lines = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"

# Debug builds keep line tables (enough for backtraces) and no debug info for
# dependencies: the Typst stack's full debug info made test binaries take gigabytes of
# memory to link and tens of gigabytes of disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
