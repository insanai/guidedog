[package]
name = "guidedog-cmd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "guidedog"
path = "src/main.rs"

[dependencies]
gd-cli = { workspace = true }
gd-host = { workspace = true }
# The registry of the plugins linked into guidedog.
gd-plugins = { workspace = true }
# The GitHub Pages plugin, linked in: the `pages` publisher, `guidedog publish pages`
# and `guidedog pages workflow`.
gd-pages = { workspace = true }
# The discussion catalogs plugin, linked in: `guidedog dsc init`, `new`, `build`, ...
gd-discussion = { workspace = true }
gd-ssg = { workspace = true }

[lints]
workspace = true
