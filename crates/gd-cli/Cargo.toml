[package]
name = "gd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The guidedog command line as a library: parse, run, and report."

[dependencies]
guidedoc = { workspace = true }
# The engine registry `convert` and `formats` use, until guidedoc-defaults offers the
# complete one (wave 2 of the project-builder port).
guidedoc-rst = { workspace = true }
guidedoc-commonmark = { workspace = true }
guidedoc-html = { workspace = true }
guidedoc-typst = { workspace = true }
guidedoc-text = { workspace = true }
# `artifact`: `guidedog convert` runs gd_host::convert_artifact.
gd-host = { workspace = true, features = ["artifact"] }
gd-report = { workspace = true }
gd-typst = { workspace = true }
gd-plugins = { workspace = true }
gd-discussion = { workspace = true }
# The bundled default publisher: `guidedog publish pages`, `guidedog pages workflow`, and
# the linked `pages` publisher of `guidedog publish --publisher=pages`. See README.
gd-pages = { workspace = true }
gd-conf = { workspace = true }
gd-env = { workspace = true }
# `quickstart` and `migrate`.
gd-migrate = { workspace = true }
# `guidedog --version` names the Graphviz library linked in.
gd-graphdog = { workspace = true }
gd-sha = { workspace = true }

[lints]
workspace = true
