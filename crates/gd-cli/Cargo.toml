[package]
name = "gd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The guidedog command line as a library: parse, run, and report."

[dependencies]
guidedoc = { workspace = true }
# The engine registry `convert` and `formats` use.
guidedoc-defaults = { workspace = true }
# `artifact`: `guidedog convert` runs gd_host::convert_artifact.
gd-host = { workspace = true, features = ["artifact"] }
gd-report = { workspace = true }
gd-clock = { workspace = true }
gd-typst = { workspace = true }
gd-plugins = { workspace = true }
gd-conf = { workspace = true }
gd-env = { workspace = true }
# build, clean, serve, intl, and the in-process build of publish and plugin commands.
gd-project = { workspace = true }
gd-serve = { workspace = true }
gd-intl = { workspace = true }
# `intl stat` formats its counts as sphinx-intl does.
gd-gettext = { workspace = true }
# `quickstart` and `migrate`.
gd-migrate = { workspace = true }
# `guidedog --version` names the Graphviz library linked in.
gd-graphdog = { workspace = true }
gd-sha = { workspace = true }

[lints]
workspace = true
