[package]
name = "gd-graphdog"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Graphviz DOT to SVG, PNG or laid-out DOT with the Graphviz C library in process."
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["graphviz", "dot", "svg", "diagram", "graph"]
categories = ["visualization", "api-bindings", "rendering"]
include = ["src/**", "build.rs", "README.md", "LICENSE"]

# No external crates: Graphviz (libgvc, libcgraph) is bound by hand in src/ffi.rs, and
# build.rs (std only) picks shared or static linking.
[features]
# Links the static Graphviz that `cargo xtask graphviz` builds into target/graphviz;
# setting GUIDEDOG_GRAPHVIZ_STATIC=<dir> does the same for any folder.
static-graphviz = []

[dependencies]
gd-report = { workspace = true }

[lints]
workspace = true
