[package]
name = "gd-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
guidedoc = { workspace = true }
gd-report = { workspace = true }
# Only `convert_artifact` compiles Typst; crates that just need problems, files or
# interrupts turn the `artifact` feature off and stay free of the compiler.
gd-typst = { workspace = true, optional = true }

[features]
default = ["artifact"]
# `convert_artifact`: the `guidedog convert` route, which needs the Typst backend.
artifact = ["dep:gd-typst"]

[lints]
workspace = true
