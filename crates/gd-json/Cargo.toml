[package]
name = "gd-json"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "JSON over serde_json: duplicate-key and depth checks, HTML-safe output."
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["json", "parser", "serialization", "html-safe"]
categories = ["encoding", "parser-implementations"]
include = ["src/**", "README.md"]

[dependencies]
gd-report.workspace = true
# serde_json does the parsing and writing; it is already compiled into the workspace by
# the embedded Typst compiler, so this crate is a thin API over it (see README.md).
serde_json.workspace = true
# The Deserializer/Visitor traits for the validating parse (duplicate keys, depth).
serde.workspace = true

[lints]
workspace = true
