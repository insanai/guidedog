# Configuration file for Guidedog.
#
# The settings use the names of Sphinx's conf.py, written in TOML:
# https://www.sphinx-doc.org/en/master/usage/configuration.html

# -- Project information -----------------------------------------------------

project = "{{project}}"
copyright = "{{copyright}}"
author = "{{author}}"
version = "{{version}}"
release = "{{release}}"

# -- General configuration ---------------------------------------------------

extensions = []
templates_path = ["_templates"]
exclude_patterns = ["{{build}}", "Thumbs.db", ".DS_Store"]
language = "{{language}}"
source_suffix = [{{suffixes}}]
root_doc = "{{root}}"

# -- Options for HTML output -------------------------------------------------

html_theme = "guidedog"
html_static_path = ["_static"]

# -- Options for PDF output (book.typ imports the shared theme.typ) ----------

pdf_paper_size = "a4"
