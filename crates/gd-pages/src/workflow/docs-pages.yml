# Generated by guidedog pages workflow. Check it with guidedog pages workflow --check.
# Action commits are pinned; review their updates separately.
@NOTE@name: Documentation
on:
  push:
    branches: [@BRANCH@]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: @CHECKOUT@
        with:
          persist-credentials: false

      - name: Install Guidedog
        env:
          GUIDEDOG_VERSION: @VERSION@
          GUIDEDOG_SHA256: @SHA256@
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/guidedog-linux-amd64.tar.gz"
          url="https://github.com/@RELEASES@/releases/download/v${GUIDEDOG_VERSION}/guidedog-linux-amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location "$url" -o "$archive"
          printf '%s  %s\n' "$GUIDEDOG_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/guidedog"
          tar -xzf "$archive" -C "$RUNNER_TEMP/guidedog" --strip-components=1
          echo "$RUNNER_TEMP/guidedog" >> "$GITHUB_PATH"

      - name: Configure Pages
        id: pages
        if: github.ref == 'refs/heads/@BRANCH@' && github.event_name != 'pull_request'
        uses: @CONFIGURE@

      - name: Build the site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          guidedog --version
          guidedog build -b html @PROJECT@ build/site -W -D "html_baseurl=$PAGES_BASE_URL"
          test -s build/site/index.html
          touch build/site/.nojekyll

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/@BRANCH@' && github.event_name != 'pull_request'
        uses: @UPLOAD@
        with:
          path: build/site

  deploy:
    if: github.ref == 'refs/heads/@BRANCH@' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: @DEPLOY@
