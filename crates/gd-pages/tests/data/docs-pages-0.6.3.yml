# Generated by guidedog-pages workflow. Check it with guidedog-pages workflow --check.
# Action commits are pinned; review their updates separately.
name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Guidedog
        env:
          GUIDEDOG_VERSION: 0.6.3
          GUIDEDOG_SHA256: 35eca388ac7a4061076bfa688102127acdb2f1db30e183c8a5b8002362e359d0
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/guidedog-linux-amd64.tar.gz"
          url="https://github.com/insanai/guidedog/releases/download/v${GUIDEDOG_VERSION}/guidedog-linux-amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location "$url" -o "$archive"
          printf '%s  %s\n' "$GUIDEDOG_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/guidedog"
          tar -xzf "$archive" -C "$RUNNER_TEMP/guidedog" --strip-components=1
          echo "$RUNNER_TEMP/guidedog" >> "$GITHUB_PATH"

      - name: Configure Pages
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          guidedog --version
          guidedog build -b html docs build/site -W -D "html_baseurl=$PAGES_BASE_URL"
          test -s build/site/index.html
          touch build/site/.nojekyll

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
