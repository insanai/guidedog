[package]
name = "gd-typst"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The embedded compiler links Typst in; without it, only an installed `typst` program runs.
default = ["embedded"]
embedded = ["dep:typst", "dep:typst-layout", "dep:typst-pdf", "dep:typst-html", "dep:typst-kit"]

[dependencies]
# The Typst compiler (allowed by CLAUDE.md): fonts come from extra font directories and the
# system first, then the embedded set; packages resolve like the typst CLI (data directory,
# cache, then a Typst Universe download unless the compile is offline).
typst = { workspace = true, optional = true }
typst-layout = { workspace = true, optional = true }
typst-pdf = { workspace = true, optional = true }
typst-html = { workspace = true, optional = true }
typst-kit = { workspace = true, optional = true, features = [
    "embedded-fonts", "scan-fonts", "system-packages", "system-downloader",
] }

[lints]
workspace = true

# Linux links OpenSSL statically (for the package downloader), as the old bridge did: one
# binary runs on any distribution, and building needs no OpenSSL headers or pkg-config.
# macOS uses the Security framework and Windows SChannel, so they need nothing extra.
[target.'cfg(target_os = "linux")'.dependencies]
typst-kit = { workspace = true, optional = true, features = ["vendor-openssl"] }
